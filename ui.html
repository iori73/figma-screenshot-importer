<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bulk Screenshot Importer</title>
  <style>:root {
  --bg: #fff;
  --bg-secondary: #fafafa;
  --bg-hover: #f5f5f5;
  --text: #333;
  --text-secondary: #666;
  --text-tertiary: #999;
  --border: #e5e5e5;
  --border-secondary: #ddd;
  --border-dashed: #ccc;
  --accent: #18a0fb;
  --accent-hover: #0d8de5;
  --accent-bg: #f0f9ff;
  --accent-bg-strong: #e0f2fe;
  --danger: #e11d48;
  --danger-bg: #fff1f2;
  --purple: #9333ea;
  --purple-bg: #f3e8ff;
  --blue: #2563eb;
  --info-bg: #fffbeb;
  --info-text: #92400e;
  --stats-bg: #f0f9ff;
  --stats-text: #0369a1;
  --skipped-bg: #fef9c3;
  --skipped-text: #854d0e;
  --warning-bg: #fef3c7;
  --warning-border: #fbbf24;
  --progress-track: #e5e5e5;
  --disabled-bg: #ccc;
  --error-text: #dc2626;
  --scroll-border: var(--accent);
  --scroll-badge-bg: var(--bg);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2c2c2c;
    --bg-secondary: #383838;
    --bg-hover: #444;
    --text: #e0e0e0;
    --text-secondary: #aaa;
    --text-tertiary: #888;
    --border: #555;
    --border-secondary: #666;
    --border-dashed: #777;
    --accent: #4cb3ff;
    --accent-hover: #7ac6ff;
    --accent-bg: #1a3a50;
    --accent-bg-strong: #1e4a6a;
    --danger: #f87171;
    --danger-bg: #4a1c1c;
    --purple: #c084fc;
    --purple-bg: #3b1f5c;
    --blue: #60a5fa;
    --info-bg: #422006;
    --info-text: #fcd34d;
    --stats-bg: #1a3a50;
    --stats-text: #7dd3fc;
    --skipped-bg: #422006;
    --skipped-text: #fde68a;
    --warning-bg: #422006;
    --warning-border: #b45309;
    --progress-track: #555;
    --disabled-bg: #555;
    --error-text: #fca5a5;
    --scroll-badge-bg: #383838;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 12px;
  color: var(--text);
  padding: 0;
  background: var(--bg);
}

h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.section { margin-bottom: 12px; }
.first-section { padding-top: 16px; }
.pad { padding-left: 16px; padding-right: 16px; }

/* ---- Drop Zone ---- */
.drop-zone {
  border: 2px dashed var(--border-dashed); border-radius: 8px; padding: 28px 16px;
  text-align: center; cursor: pointer; transition: all 0.2s;
}
.drop-zone:hover { border-color: var(--accent); background: var(--accent-bg); }
.drop-zone:focus-within { border-color: var(--accent); background: var(--accent-bg); }
.drop-zone.drag-over { border-color: var(--accent); background: var(--accent-bg-strong); }
.drop-zone.has-files {
  padding: 12px 16px; border-style: solid; border-color: var(--accent);
  background: var(--accent-bg);
}
.drop-zone.has-files .drop-zone-text strong { font-size: 12px; }
.drop-zone input[type="file"] { display: none; }
.drop-zone-text { color: var(--text-secondary); }
.drop-zone-text strong { color: var(--accent); font-size: 13px; }
.drop-zone-sub { font-size: 11px; color: var(--text-tertiary); }

.file-alt {
  margin-top: 10px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.file-alt-divider {
  font-size: 10px; color: var(--text-tertiary); text-transform: lowercase;
}
.file-alt-btn {
  font-size: 11px; color: var(--accent); background: none; border: none;
  cursor: pointer; text-decoration: underline; padding: 4px 8px;
}
.file-alt-btn:hover { color: var(--accent-hover); }
.clear-all-btn { color: var(--danger); text-decoration: underline; }
.clear-all-btn:hover { color: #be123c; }

/* ---- Folder Preview ---- */
.preview {
  max-height: 300px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 4px; padding: 8px; background: var(--bg-secondary);
  font-family: monospace; font-size: 11px; line-height: 1.6;
}
.preview-item { padding: 2px 0; }
.preview-section { color: var(--purple); font-weight: bold; }
.preview-folder { color: var(--blue); padding-left: 12px; }
.preview-file { color: var(--text); padding-left: 24px; }

/* ---- Stats ---- */
.stats {
  margin-top: 8px; padding: 8px; background: var(--stats-bg);
  border-radius: 4px; color: var(--stats-text);
}

/* ---- Progress ---- */
.progress { margin-top: 8px; display: none; }
.progress-bar {
  height: 4px; background: var(--progress-track); border-radius: 2px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
.progress-text { margin-top: 4px; color: var(--text-secondary); font-size: 11px; }

/* ---- Buttons ---- */
button.primary-btn {
  width: 100%; padding: 10px 16px; background: var(--accent); color: white;
  border: none; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background 0.2s;
}
button.primary-btn:hover:not(:disabled) { background: var(--accent-hover); }
button.primary-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary-btn:disabled { background: var(--disabled-bg); cursor: not-allowed; }

button.cancel-btn {
  width: 100%; padding: 8px 16px; background: none; color: var(--danger);
  border: 1px solid var(--danger); border-radius: 6px; font-size: 12px;
  cursor: pointer; margin-top: 6px; transition: all 0.2s;
}
button.cancel-btn:hover { background: var(--danger-bg); }
button.cancel-btn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

/* ---- Settings Accordion ---- */
.settings-accordion {
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
.settings-accordion summary {
  padding: 8px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
  color: var(--text-secondary); background: var(--bg-secondary);
  list-style: none; display: flex; align-items: center; gap: 6px;
}
.settings-accordion summary::before {
  content: '⚙'; font-size: 13px;
}
.settings-accordion summary::after {
  content: '▸'; margin-left: auto; transition: transform 0.2s;
}
.settings-accordion[open] summary::after { transform: rotate(90deg); }
.settings-accordion summary:hover { background: var(--bg-hover); }
.settings-body { padding: 10px 12px; }

.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.settings:last-child { margin-bottom: 0; }
.setting-item { display: flex; flex-direction: column; gap: 4px; }
.setting-item label { font-size: 11px; color: var(--text-secondary); }
.setting-item input[type="number"] {
  padding: 6px 8px; border: 1px solid var(--border-secondary); border-radius: 4px;
  font-size: 12px; background: var(--bg); color: var(--text);
}
.setting-item input[type="range"] { width: 100%; }
.setting-hint { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
.setting-link { font-size: 10px; color: var(--accent); text-decoration: none; margin-top: 2px; }
.setting-link:hover { text-decoration: underline; }
/* ---- Smart Import Preview ---- */
.smart-preview {
  max-height: 400px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 6px; background: var(--bg-secondary);
}
.smart-section { border-bottom: 1px solid var(--border); padding: 10px; }
.smart-section:last-child { border-bottom: none; }
.smart-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.smart-section-header .section-badge {
  font-size: 10px; font-weight: 600; color: var(--purple); background: var(--purple-bg);
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
}
.section-name-wrapper {
  flex: 1; position: relative; display: flex; align-items: center;
}
.section-name-input {
  width: 100%; padding: 4px 6px; border: 1px solid var(--border-secondary);
  border-radius: 4px; font-size: 12px; font-weight: 500;
  background: var(--bg); color: var(--text);
}
.section-name-input::placeholder {
  color: var(--text-tertiary); font-style: italic; font-weight: 400;
}
.section-name-input:focus { outline: none; border-color: var(--accent); }
.smart-section-count { font-size: 10px; color: var(--text-tertiary); white-space: nowrap; }
.smart-section-thumbs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.smart-group-wrapper { display: flex; flex-direction: column; gap: 0; flex-shrink: 0; }
.smart-group-wrapper.scroll-group {
  border: 2px solid var(--scroll-border); border-radius: 4px;
  padding: 2px; position: relative;
}
.smart-group-wrapper.scroll-group::after {
  content: 'scroll'; position: absolute; top: -8px; right: 4px;
  font-size: 8px; color: var(--accent); background: var(--scroll-badge-bg); padding: 0 3px;
}
.smart-thumb {
  width: 48px; height: auto; border-radius: 2px;
  border: 1px solid var(--border); display: block;
}

.analysis-info {
  padding: 8px 10px; background: var(--info-bg); border-radius: 4px;
  color: var(--info-text); font-size: 11px; margin-bottom: 8px;
}
.re-analyze-btn {
  width: auto; padding: 6px 12px; background: var(--bg-hover); color: var(--text);
  border: 1px solid var(--border-secondary); border-radius: 4px; font-size: 11px;
  cursor: pointer; margin-top: 8px;
}
.re-analyze-btn:hover { background: var(--border); }
.re-analyze-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.skipped-notice {
  padding: 6px 8px; background: var(--skipped-bg); border-radius: 4px;
  color: var(--skipped-text); font-size: 11px; margin-top: 6px;
}

/* Folder preview section name input (inline in tree) */
.preview .section-name-input {
  font-family: monospace; font-size: 11px; font-weight: bold;
  color: var(--purple); background: var(--bg); border: 1px solid var(--accent);
  border-radius: 3px; padding: 1px 4px; margin-left: 2px; width: 55%;
  outline: none;
}
.preview .section-name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ---- Footer ---- */
.footer {
  display: flex; justify-content: center; align-items: center; gap: 12px;
  padding: 8px 16px; border-top: 1px solid var(--border);
}
.footer a { color: var(--accent); font-size: 11px; text-decoration: none; }
.lang-switcher {
  display: flex; border: 1px solid var(--border-secondary); border-radius: 4px; overflow: hidden;
}
.lang-option {
  font-size: 10px; font-weight: 500; padding: 3px 8px; cursor: pointer;
  background: none; border: none; color: var(--text-tertiary);
  transition: background 0.15s, color 0.15s;
}
.lang-option:not(:last-child) { border-right: 1px solid var(--border-secondary); }
.lang-option:hover { background: var(--bg-hover); color: var(--text-secondary); }
.lang-option.active {
  background: var(--accent); color: #fff; font-weight: 600;
}
.lang-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>

  <!-- ============== Select Images ============== -->
  <div class="section pad first-section" id="selectSection">
    <div class="drop-zone" id="dropZone" role="button" tabindex="0"
         aria-label="Select screenshots">
      <input type="file" id="folderInput" webkitdirectory directory multiple
             aria-label="Folder file picker">
      <p class="drop-zone-text">
        <strong data-i18n="clickSelectFolder">Click to select folder</strong><br>
        <span class="drop-zone-sub" data-i18n="dropHint">or drop image files here (not folders)</span>
      </p>
    </div>
    <div class="file-alt">
      <span class="file-alt-divider" data-i18n="orDivider">or</span>
      <button class="file-alt-btn" id="fileSelectBtn" type="button"
              data-i18n="chooseFiles">Choose individual files</button>
      <input type="file" id="fileInput" multiple accept="image/png,image/jpeg"
             style="display:none" aria-label="Individual file picker">
      <button class="file-alt-btn clear-all-btn" id="clearAllBtn" type="button"
              style="display:none" onclick="clearAllFiles()" data-i18n="clearAll">Clear all</button>
    </div>
    <div id="skippedNotice" aria-live="polite"></div>
  </div>

  <!-- ============== Analysis Progress ============== -->
  <div class="section pad" id="analysisSection" style="display: none;">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar"><div class="progress-fill" id="analysisProgressFill"></div></div>
      <div class="progress-text" id="analysisProgressText" aria-live="polite">Analyzing...</div>
    </div>
    <button class="cancel-btn" id="cancelAnalysisBtn" type="button"
            onclick="cancelImport('analysis')" data-i18n="cancelAnalysis">Cancel Analysis</button>
  </div>

  <!-- ============== Unified Preview ============== -->
  <div class="section pad" id="previewSection" style="display: none;">
    <h2 data-i18n="previewTitle">Preview</h2>

    <div id="folderPreviewWrap" style="display: none;">
      <div class="preview" id="folderPreviewContent" aria-live="polite"></div>
    </div>

    <div id="smartPreviewWrap" style="display: none;">
      <div class="analysis-info" id="analysisInfo" aria-live="polite"></div>
      <div class="smart-preview" id="smartPreview" aria-live="polite"></div>
      <button class="re-analyze-btn" type="button" onclick="reAnalyze()"
              data-i18n="reAnalyze">Re-analyze with current settings</button>
    </div>

    <div class="stats" id="stats" aria-live="polite"></div>
  </div>

  <!-- ============== Settings (collapsible) ============== -->
  <div class="section pad">
    <details class="settings-accordion" id="settingsAccordion">
      <summary data-i18n="settingsTitle">Settings</summary>
      <div class="settings-body">
        <div class="settings">
          <div class="setting-item">
            <label for="imageWidth" data-i18n="imageWidth">Image Width (px)</label>
            <input type="number" id="imageWidth" value="390" min="100" max="1920">
          </div>
          <div class="setting-item">
            <label for="maxChunkHeight" data-i18n="maxChunkHeight">Max Chunk Height (px)</label>
            <input type="number" id="maxChunkHeight" value="4096" min="1000" max="8192">
          </div>
        </div>
        <div class="settings smart-only-settings" id="smartSettings" style="display: none;">
          <div class="setting-item">
            <label for="scrollSensitivity" data-i18n="scrollSens">Scroll Sensitivity</label>
            <input type="range" id="scrollSensitivity" min="0.50" max="0.99" step="0.01" value="0.85"
                   oninput="document.getElementById('scrollSensLabel').textContent=this.value">
            <span id="scrollSensLabel" style="font-size: 10px; color: var(--text-tertiary);">0.85</span>
            <span class="setting-hint" data-i18n="scrollSensHint">Higher = stricter scroll matching</span>
          </div>
          <div class="setting-item">
            <label for="sectionSensitivity" data-i18n="sectionSens">Section Sensitivity</label>
            <input type="range" id="sectionSensitivity" min="0.30" max="0.95" step="0.01" value="0.70"
                   oninput="document.getElementById('sectionSensLabel').textContent=this.value">
            <span id="sectionSensLabel" style="font-size: 10px; color: var(--text-tertiary);">0.70</span>
            <span class="setting-hint" data-i18n="sectionSensHint">Higher = more sections detected</span>
          </div>
        </div>
      </div>
    </details>
  </div>

  <!-- ============== Import ============== -->
  <div class="section pad">
    <button class="primary-btn" id="importBtn" disabled data-i18n="importBtn">Import to Figma</button>
    <button class="cancel-btn" id="cancelImportBtn" style="display:none" type="button"
            onclick="cancelCurrentImport()" data-i18n="cancelImport">Cancel Import</button>
    <div class="progress" id="importProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar"><div class="progress-fill" id="importProgressFill"></div></div>
      <div class="progress-text" id="importProgressText" aria-live="polite"></div>
    </div>
  </div>

  <!-- ============== Footer ============== -->
  <div class="footer">
    <a href="https://github.com/iori73/figma-screenshot-importer#usage-guide"
       target="_blank" data-i18n="viewGuide">View Usage Guide</a>
    <div class="lang-switcher" role="radiogroup" aria-label="Language">
      <button class="lang-option" id="langEn" data-lang="en" onclick="setLang('en')" role="radio" aria-checked="true">EN</button>
      <button class="lang-option" id="langJa" data-lang="ja" onclick="setLang('ja')" role="radio" aria-checked="false">JA</button>
    </div>
  </div>
