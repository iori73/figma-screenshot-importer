<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="128" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#18A0FB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="128" height="128" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#roundedClip)">
    <rect width="128" height="128" fill="url(#bgGrad)"/>

    <!-- Section outlines (white, subtle) -->
    <!-- Top section -->
    <rect x="12" y="16" width="62" height="50" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <!-- Bottom-left section -->
    <rect x="12" y="72" width="40" height="44" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <!-- Bottom-right section -->
    <rect x="56" y="72" width="60" height="44" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <!-- Right section -->
    <rect x="78" y="16" width="38" height="50" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

    <!-- Section labels (tiny) -->
    <rect x="14" y="17" width="16" height="3" rx="1" fill="rgba(255,255,255,0.35)"/>
    <rect x="80" y="17" width="12" height="3" rx="1" fill="rgba(255,255,255,0.35)"/>
    <rect x="14" y="73" width="14" height="3" rx="1" fill="rgba(255,255,255,0.35)"/>
    <rect x="58" y="73" width="16" height="3" rx="1" fill="rgba(255,255,255,0.35)"/>

    <!-- Top section: 4 screen cards -->
    <g>
      <!-- Card 1 -->
      <rect x="16" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="16" y="24" width="12" height="4" rx="1.5" fill="#E0E7FF" opacity="0.9"/>
      <rect x="18" y="30" width="8" height="1" rx="0.5" fill="#C7D2FE" opacity="0.7"/>
      <rect x="18" y="33" width="6" height="1" rx="0.5" fill="#C7D2FE" opacity="0.5"/>
      <rect x="18" y="36" width="8" height="3" rx="0.5" fill="#E0E7FF" opacity="0.5"/>

      <!-- Card 2 -->
      <rect x="30" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="30" y="24" width="12" height="4" rx="1.5" fill="#DBEAFE" opacity="0.9"/>
      <rect x="32" y="30" width="8" height="1" rx="0.5" fill="#BFDBFE" opacity="0.7"/>
      <rect x="32" y="33" width="5" height="1" rx="0.5" fill="#BFDBFE" opacity="0.5"/>
      <rect x="32" y="36" width="8" height="3" rx="0.5" fill="#DBEAFE" opacity="0.5"/>

      <!-- Card 3 (scroll group - 2 cards stacked) -->
      <g>
        <rect x="43.5" y="23.5" width="14" height="42" rx="2" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="2 1"/>
        <rect x="44" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
        <rect x="44" y="24" width="12" height="4" rx="1.5" fill="#FCE7F3" opacity="0.9"/>
        <rect x="46" y="30" width="8" height="1" rx="0.5" fill="#FBCFE8" opacity="0.7"/>
        <rect x="46" y="33" width="6" height="1" rx="0.5" fill="#FBCFE8" opacity="0.5"/>

        <rect x="44" y="45" width="12" height="19" rx="1.5" fill="white" opacity="0.85"/>
        <rect x="46" y="47" width="8" height="1" rx="0.5" fill="#FBCFE8" opacity="0.7"/>
        <rect x="46" y="50" width="5" height="1" rx="0.5" fill="#FBCFE8" opacity="0.5"/>
        <rect x="46" y="53" width="8" height="3" rx="0.5" fill="#FCE7F3" opacity="0.5"/>
      </g>

      <!-- Card 4 -->
      <rect x="60" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="60" y="24" width="12" height="4" rx="1.5" fill="#D1FAE5" opacity="0.9"/>
      <rect x="62" y="30" width="8" height="1" rx="0.5" fill="#A7F3D0" opacity="0.7"/>
      <rect x="62" y="33" width="7" height="1" rx="0.5" fill="#A7F3D0" opacity="0.5"/>
    </g>

    <!-- Right section: 2 screen cards -->
    <g>
      <rect x="82" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="82" y="24" width="12" height="4" rx="1.5" fill="#FEF3C7" opacity="0.9"/>
      <rect x="84" y="30" width="8" height="1" rx="0.5" fill="#FDE68A" opacity="0.7"/>
      <rect x="84" y="33" width="6" height="1" rx="0.5" fill="#FDE68A" opacity="0.5"/>

      <rect x="96" y="24" width="12" height="21" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="96" y="24" width="12" height="4" rx="1.5" fill="#FEF3C7" opacity="0.9"/>
      <rect x="98" y="30" width="8" height="1" rx="0.5" fill="#FDE68A" opacity="0.7"/>
      <rect x="98" y="33" width="5" height="1" rx="0.5" fill="#FDE68A" opacity="0.5"/>
    </g>

    <!-- Bottom-left section: 2 cards + 1 scroll group -->
    <g>
      <rect x="16" y="80" width="10" height="18" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="16" y="80" width="10" height="3.5" rx="1.5" fill="#E0E7FF" opacity="0.9"/>
      <rect x="18" y="85" width="6" height="1" rx="0.5" fill="#C7D2FE" opacity="0.6"/>

      <!-- Scroll group -->
      <g>
        <rect x="27.5" y="79.5" width="12" height="34" rx="1.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="2 1"/>
        <rect x="28" y="80" width="10" height="16" rx="1.5" fill="white" opacity="0.92"/>
        <rect x="28" y="80" width="10" height="3.5" rx="1.5" fill="#DBEAFE" opacity="0.9"/>
        <rect x="30" y="85" width="6" height="1" rx="0.5" fill="#BFDBFE" opacity="0.6"/>

        <rect x="28" y="96" width="10" height="16" rx="1.5" fill="white" opacity="0.85"/>
        <rect x="30" y="98" width="6" height="1" rx="0.5" fill="#BFDBFE" opacity="0.6"/>
        <rect x="30" y="101" width="4" height="1" rx="0.5" fill="#BFDBFE" opacity="0.4"/>
      </g>

      <rect x="40" y="80" width="10" height="18" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="40" y="80" width="10" height="3.5" rx="1.5" fill="#D1FAE5" opacity="0.9"/>
      <rect x="42" y="85" width="6" height="1" rx="0.5" fill="#A7F3D0" opacity="0.6"/>
    </g>

    <!-- Bottom-right section: 3 cards -->
    <g>
      <rect x="60" y="80" width="10" height="18" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="60" y="80" width="10" height="3.5" rx="1.5" fill="#FCE7F3" opacity="0.9"/>
      <rect x="62" y="85" width="6" height="1" rx="0.5" fill="#FBCFE8" opacity="0.6"/>

      <rect x="72" y="80" width="10" height="18" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="72" y="80" width="10" height="3.5" rx="1.5" fill="#FEF3C7" opacity="0.9"/>
      <rect x="74" y="85" width="6" height="1" rx="0.5" fill="#FDE68A" opacity="0.6"/>

      <!-- Scroll group -->
      <g>
        <rect x="83.5" y="79.5" width="12" height="34" rx="1.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="2 1"/>
        <rect x="84" y="80" width="10" height="16" rx="1.5" fill="white" opacity="0.92"/>
        <rect x="84" y="80" width="10" height="3.5" rx="1.5" fill="#E0E7FF" opacity="0.9"/>
        <rect x="86" y="85" width="6" height="1" rx="0.5" fill="#C7D2FE" opacity="0.6"/>

        <rect x="84" y="96" width="10" height="16" rx="1.5" fill="white" opacity="0.85"/>
        <rect x="86" y="98" width="6" height="1" rx="0.5" fill="#C7D2FE" opacity="0.6"/>
      </g>

      <rect x="98" y="80" width="10" height="18" rx="1.5" fill="white" opacity="0.92"/>
      <rect x="98" y="80" width="10" height="3.5" rx="1.5" fill="#DBEAFE" opacity="0.9"/>
      <rect x="100" y="85" width="6" height="1" rx="0.5" fill="#BFDBFE" opacity="0.6"/>
    </g>
  </g>
</svg>
