<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="sectionShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="arrowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9333EA" flood-opacity="0.35"/>
    </filter>

    <!--
      Figma brand colors (muted for harmony):
      Green  #0ACF83 → header #E2F5ED  accent #5BBF99  tint #F0FAF5
      Blue   #1ABCFE → header #E0F0F8  accent #6DB5CF  tint #EFF6FB
      Purple #A259FF → header #EDE4F6  accent #A088D0  tint #F5F0FB
      Red    #F24E1E → header #F6E2DA  accent #CC8A74  tint #FBF0EC
      Coral  #FF7262 → header #F8E4E0  accent #D49C94  tint #FBF0EE
    -->
  </defs>

  <!-- Background -->
  <rect width="1920" height="960" fill="url(#bgGradient)"/>
  <g opacity="0.05">
    <pattern id="gridDots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF"/>
    </pattern>
    <rect width="1920" height="960" fill="url(#gridDots)"/>
  </g>

  <!-- ============ Title ============ -->
  <g filter="url(#textGlow)">
    <text x="960" y="115" text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="64" font-weight="800" fill="#FFFFFF">Bulk Screenshot Importer</text>
    <text x="960" y="165" text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="26" font-weight="400" fill="#888888">Organize screenshots into Figma sections — instantly</text>
  </g>

  <!-- ================================================================ -->
  <!-- LEFT: Scattered Screenshots (Before)                            -->
  <!-- Cards: 100×216 = iPhone 13 ratio (390:844 = 1:2.164)           -->
  <!-- ================================================================ -->

  <!-- Card D — far back, faded, green -->
  <g filter="url(#cardShadow)" transform="translate(185, 530) rotate(14)" opacity="0.45">
    <rect x="-45" y="-98" width="90" height="195" rx="6" fill="#FFFFFF"/>
    <rect x="-45" y="-98" width="90" height="18" rx="6" fill="#E2F5ED"/>
    <rect x="-35" y="-86" width="38" height="4" rx="2" fill="#5BBF99" opacity="0.5"/>
    <rect x="-35" y="-72" width="70" height="4" rx="1.5" fill="#EBEBEB"/>
    <rect x="-35" y="-62" width="70" height="50" rx="3" fill="#F0FAF5" opacity="0.5"/>
    <rect x="-45" y="75" width="90" height="22" rx="0" fill="#FAFAFA"/>
